name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep downloaded gems outside site/. Jekyll 3.10 otherwise scans a Bundler
    # template under site/vendor/ as if it were a post on GitHub runners.
    env:
      BUNDLE_PATH: ${{ runner.temp }}/bff-bundle
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Matches the locally verified RubyInstaller toolchain.
          ruby-version: "3.3"
          # Dependencies are installed explicitly below into runner.temp.
          bundler-cache: false
          working-directory: site

      - name: Install Ruby dependencies
        working-directory: site
        run: bundle install

      - name: Build Jekyll site
        working-directory: site
        run: bundle exec jekyll build --trace --config _config.yml,_config.github-pages.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
