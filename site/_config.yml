# Bitcoin FilmFest — Jekyll site config
# Equivalent to the old inc/config.php constants (SITE_NAME, NAV, FOOTER_LINKS, SOCIAL).

title: "Bitcoin FilmFest"
tagline: "at the 🧡 of Bitcoin Cinema"
version: "0.6.0"
description: "Orange-pill cinema, unfiat the culture. BFF'27 — June 24–27, 2027, Warsaw."
url: "https://bitcoinfilmfest.com"
baseurl: ""
lang: "en"
locale: "en_US"
social_image: "/assets/images/social/bff-social-2027.jpg"
logo: "/assets/images/brand/bff-logo-mark-white.png"
twitter:
  username: "bitcoinfilmfest"

contact_email: "info@bitcoinfilmfest.com"

# Shared menu and footer links live in _data/navigation.yml so collaborators
# can edit structure without touching layout markup or site metadata.

social:
  x: "https://x.com/bitcoinfilmfest"
  instagram: "https://instagram.com/bitcoin_filmfest"
  telegram: "https://telegram.bitcoinfilmfest.com"
  github: "https://github.com/itstomekk/bitcoinfilmfest-com"
  linkedin: "https://linkedin.com/company/bitcoin-filmfest"

# Public Nostr identity used by the site (the subscription form accepts an npub
# as text and sends it to the signup Worker; no private signing key is present).
nostr_npub: "npub1rjtrs7xqdvj3588r9njrexh2n750j7jdwx9qs543nutmdsj6ljaqpfmp8a"

# Spam phrases for the footer signup form. subscribe.js skips the request in the
# browser; the bff-signup Worker keeps its own BLOCKLIST var, keep both in step.
# Lowercase, no commas inside an entry.
subscribe_blocklist:
  - maxxspace

# Jekyll collections power the unified Reel archive and the /cinema/ ecosystem
# section (see PLAN-CINEMA.md). Each
# entry is one reviewed Markdown file with front matter — no build-time import
# from the private research KB. The News Log reaches _chronicle/ through an
# explicit editorial export, and every generated file remains reviewable here.
collections:
  reel:
    output: true
    permalink: /reel/:name/
    sort_by: date

  chronicle:
    output: false
    sort_by: date
  films:
    output: true
    permalink: /cinema/films/:name/
    sort_by: title
  companies:
    output: true
    permalink: /cinema/companies/:name/
    sort_by: title

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      image: "/assets/images/social/bff-social-2027.jpg"
  - scope:
      path: ""
      type: "reel"
    values:
      layout: "reel"
      nav_label: "Reel"
      screen: "paper"
      image: "/assets/images/social/bff-social-2027.jpg"

  - scope:
      path: ""
      type: "films"
    values:
      layout: "film"
      nav_label: "Films"
      screen: "paper"
      image: "/assets/images/social/bff-social-2027.jpg"
  - scope:
      path: ""
      type: "companies"
    values:
      layout: "company"
      nav_label: "Companies"
      screen: "paper"
      image: "/assets/images/social/bff-social-2027.jpg"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - design.md
  - _cinema-schema.md
  - SITEMAP-PLAN.md
  - .hallmark
  - Gemfile
  - Gemfile.lock
  - node_modules
