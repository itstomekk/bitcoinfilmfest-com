- label: "BFF’23"
  year: 2023
  summary: "The first Warsaw edition used community-vote language in its contemporaneous public coverage. The organiser’s mapping is shown here, with that context preserved."
  awards:
    - category: "Best Movie"
      film: "The Satoshi Mystery"
      alias: "Le Mystère Satoshi"
      director: "Rémi Forte"
      film_url: "/cinema/films/the-satoshi-mystery/"
    - category: "Best Short"
      film: "Not awarded — category not used"
      director: null
    - category: "Best Story"
      film: "Not awarded — category not used"
      director: null
    - category: "Audience Choice"
      film: "Human B"
      director: "Aaron Mucke and Eva Mühlenbäumer"
      film_url: "/cinema/films/human-b/"
  sources:
    - label: "Bitcoin.fr recap"
      url: "https://bitcoin.fr/le-mystere-satoshi-au-bitcoin-filmfest/"
