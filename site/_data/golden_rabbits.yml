      film: "No More Inflation"
      director: "Bitcoin Shooter"
      film_url: "/cinema/films/no-more-inflation/"
    - category: "Best Short"
      film: "Satoshi, the Creation of Bitcoin"
      director: "Artur Machado"
      film_url: "/cinema/films/satoshi-the-creation-of-bitcoin/"
    - category: "Best Story"
      film: "Hotel Bitcoin"
      director: "Manuel Sanabria and Carlos “Pocho” Villaverde"
      film_url: "/cinema/films/hotel-bitcoin/"
    - category: "Audience Choice"
