- label: "BFF’24"
  year: 2024
  summary: "The second edition joined the European Halving Party in Warsaw. Four Golden Rabbits categories are recorded in the official BFF newsletter."
  awards:
    - category: "Best Movie"
      film: "Dirty Coin"
      director: "Alana Mediavilla Díaz"
      film_url: "/cinema/films/dirty-coin/"
    - category: "Best Short"
      film: "HODL"
      director: "The Garcia Brothers — Drew Garcia and Nate Garcia"
    - category: "Best Story"
      film: "Searching for Satoshi"
      director: "Paul Kemp"
    - category: "Audience Choice"
      film: "My Trust in You Is Broken"
      director: "Parker Worthington"
  sources:
    - label: "Bitcoin FilmFest May 2024 newsletter"
      url: "https://bitcoinfilmfest.com/may-2024-newsletter"

- label: "BFF’25"
  year: 2025
